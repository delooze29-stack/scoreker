<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ScoreKer Cue Club</title>
<meta name="theme-color" content="#07090a">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ScoreKer palette. Layout: scoreboard strip, 3D table filling the screen, control dock at the bottom. */
:root{
  --bg:#07090a; --panel:rgba(14,22,17,.92); --card:#121C16; --card2:#16231C; --line:#1F2E25; --line2:#2C3D33;
  --text:#EDEFE9; --soft:#D6DDD8; --muted:#A9B5AD; --amber:#F5B700; --ink:#1A1300; --good:#7FE0A0; --bad:#FF8A80; --chalk:#7FB8E6;
  --display:'Bebas Neue',"Arial Narrow",Impact,sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{font-family:var(--body);font-size:14px;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* scoreboard */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:linear-gradient(#0d1511,#0a100d);border-bottom:1px solid var(--line);min-height:58px}
.pl{display:flex;flex-direction:column;justify-content:center;padding:6px 12px;position:relative;min-width:0}
.pl.right{align-items:flex-end;text-align:right}
.pl .nm{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pl .sc{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.pl .sub{font-size:11px;color:var(--muted);min-height:14px;display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.pl.right .sub{justify-content:flex-end}
.pl.on .nm{color:var(--amber)}
.pl.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--amber);border-radius:3px 3px 0 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35)}
.dot.stripe{background:#f4f1e6!important;position:relative;overflow:hidden}
.dot.stripe::after{content:"";position:absolute;left:0;right:0;top:3px;height:4px;background:var(--c)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;text-align:center}
.mid .fr{font-family:var(--mono);font-size:12px;color:var(--soft);white-space:nowrap}
.mid .on{font-size:12px;font-weight:600;white-space:nowrap}
.mid .left{font-size:11px;color:var(--muted);white-space:nowrap}

/* stage */
#stage{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;background:#050607}
#stage canvas{display:block;width:100%;height:100%}
.chip{position:absolute;pointer-events:none;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(5,8,6,.7);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;color:var(--soft)}
#turnChip{left:10px;top:10px}
#turnChip.me{color:var(--ink);background:var(--amber);border-color:var(--amber)}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);max-width:min(92%,520px);background:rgba(8,12,10,.9);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;font-size:13px;line-height:1.35;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.toast.foul{border-color:rgba(255,138,128,.6)}
.toast b{color:var(--amber)}
.stagebtn{position:absolute;appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(8,12,10,.78);color:var(--text);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;min-height:34px}
#viewBtn{right:10px;top:10px}
#menuBtn{right:10px;top:50px}
#soundBtn{right:10px;top:90px;min-width:34px}
.inset{position:absolute;right:10px;bottom:10px;width:clamp(150px,40%,250px);background:rgba(5,8,6,.82);border:1px solid rgba(255,255,255,.14);border-radius:10px;overflow:hidden;pointer-events:none}
.inset canvas{width:100%;height:auto;display:block}
.inset .cap{font-family:var(--mono);font-size:11px;color:var(--chalk);padding:2px 8px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:rgba(237,239,233,.8);background:rgba(5,8,6,.6);padding:4px 9px;border-radius:6px;pointer-events:none;max-width:52%}
.placebar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(8,12,10,.9);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 8px 8px 14px;font-size:13px;white-space:nowrap}
.think{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(8,12,10,.85);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--soft)}
.think i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:8px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* controls */
.ctl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:linear-gradient(#0a100d,#0d1511);border-top:1px solid var(--line)}
#spinPad{width:76px;height:76px;touch-action:none;cursor:pointer;border-radius:50%;display:block}
.ctlmid{display:flex;flex-direction:column;gap:8px;min-width:0}
.pw{display:flex;align-items:center;gap:8px}
.pw span{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pw input{flex:1;min-width:0;accent-color:var(--amber);height:28px}
.pw output{font-family:var(--mono);font-size:12px;width:3em;text-align:right}
.aim{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card2);color:var(--text);font-size:13px;font-weight:600;padding:8px 4px;border-radius:8px;cursor:pointer;touch-action:manipulation;min-height:38px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
#shoot{appearance:none;border:0;background:var(--amber);color:var(--ink);font-family:var(--display);font-size:24px;letter-spacing:1px;width:96px;padding:0;overflow:hidden;height:84px;border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(245,183,0,.18)}
#shoot:disabled{opacity:.35;box-shadow:none}
.spininfo{font-size:10px;color:var(--muted);text-align:center;margin-top:3px;white-space:nowrap}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,6,5,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sheet{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
.brand{font-family:var(--display);color:var(--amber);font-size:16px;letter-spacing:1px}
.sheet h1{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;letter-spacing:.5px}
.sheet p{margin:0;color:var(--soft);line-height:1.45}
.lab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.game{appearance:none;text-align:left;border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.game[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.game b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.5px;line-height:1}
.game small{color:var(--muted);font-size:11px;line-height:1.3}
.game .sw{height:34px;border-radius:7px;position:relative;overflow:hidden;border:5px solid var(--w)}
.game .sw i{position:absolute;width:10px;height:10px;border-radius:50%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0b120e;border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:9px 2px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{appearance:none;border:0;background:var(--amber);color:var(--ink);font-family:var(--display);font-size:28px;letter-spacing:1px;border-radius:12px;padding:12px;cursor:pointer}
.ghostbtn{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:12px;padding:12px;font-weight:600;cursor:pointer}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{color:var(--soft);text-decoration:none;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.big{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:.5px}
.statgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 14px;font-family:var(--mono);font-size:13px}
.statgrid span:nth-child(3n+1){color:var(--muted);font-family:var(--body)}
@media (max-width:420px){.games{grid-template-columns:minmax(0,1fr)}.game{flex-direction:row;align-items:center}.game .sw{width:64px;flex:none}.ctl{gap:8px}#shoot{width:84px}}
@media (min-width:900px){#app{max-width:1300px;margin:0 auto}}
</style>
</head>
<body>
<div id="app">
  <header class="hud" aria-live="polite">
    <div class="pl" id="p0"><div class="nm"></div><div class="sc">0</div><div class="sub"></div></div>
    <div class="mid"><div class="fr" id="frames"></div><div class="on" id="onTxt"></div><div class="left" id="leftTxt"></div></div>
    <div class="pl right" id="p1"><div class="nm"></div><div class="sc">0</div><div class="sub"></div></div>
  </header>
  <main id="stage" aria-label="Table. Drag left or right to aim, up or down to raise the view.">
    <div class="chip" id="turnChip"></div>
    <div class="toast" id="toast"></div>
    <button class="stagebtn" id="viewBtn" type="button">Overhead</button>
    <button class="stagebtn" id="menuBtn" type="button">Menu</button>
    <button class="stagebtn" id="soundBtn" type="button" aria-label="Sound">🔊</button>
    <div class="inset" id="inset"><canvas id="ov" width="460" height="230"></canvas><div class="cap" id="ovTxt"></div></div>
    <div class="hint" id="hint"></div>
    <div class="placebar" id="placeBar" hidden><span id="placeTxt">Drag the cue ball into place</span><button class="btn" id="placeDone" type="button" style="min-height:34px;padding:6px 14px;background:var(--amber);color:var(--ink);border:0">Done</button></div>
    <div class="think" id="think" hidden><i></i><span id="thinkTxt">Thinking…</span></div>
  </main>
  <footer class="ctl">
    <div>
      <svg id="spinPad" viewBox="-50 -50 100 100" role="img" aria-label="Cue ball. Tap where the tip should strike. Double-tap to reset.">
        <defs><radialGradient id="cbG" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbc7b8"/></radialGradient></defs>
        <circle r="47" fill="url(#cbG)"/><circle r="37.6" fill="none" stroke="#b6b2a3" stroke-dasharray="3 3"/>
        <line x1="-47" x2="47" stroke="#d2cebf"/><line y1="-47" y2="47" stroke="#d2cebf"/>
        <circle id="spinDot" r="8" fill="#23466a" stroke="#fff" stroke-width="1.5"/>
      </svg>
      <div class="spininfo" id="spinTxt">Centre</div>
    </div>
    <div class="ctlmid">
      <label class="pw" for="pw"><span>Power</span><input id="pw" type="range" min="2" max="100" value="40"><output id="pwOut">40%</output></label>
      <div class="aim" role="group" aria-label="Fine aim">
        <button class="btn" id="aL2" type="button" aria-label="Aim left 1 degree">« 1°</button>
        <button class="btn" id="aL1" type="button" aria-label="Aim left a tenth of a degree">‹ .1°</button>
        <button class="btn" id="aR1" type="button" aria-label="Aim right a tenth of a degree">.1° ›</button>
        <button class="btn" id="aR2" type="button" aria-label="Aim right 1 degree">1° »</button>
      </div>
    </div>
    <button id="shoot" type="button">SHOOT</button>
  </footer>
</div>

<div class="overlay" id="menu">
  <div class="sheet">
    <div><div class="brand">SCOREKER</div><h1>Cue Club</h1></div>
    <p>Full physics snooker and pool against the computer or a mate on the same phone.</p>
    <div><div class="lab">Game</div><div class="games" id="gamePick"></div></div>
    <div><div class="lab">Opponent</div><div class="seg" id="oppPick"></div></div>
    <div class="row2">
      <div><div class="lab">Frames</div><div class="seg" id="framePick"></div></div>
      <div><div class="lab">Guides</div><div class="seg" id="guidePick"></div></div>
    </div>
    <div class="row2"><button class="go" id="startBtn" type="button">Play</button><button class="ghostbtn" id="resumeBtn" type="button" hidden>Back to the table</button></div>
    <div class="links"><a href="../">← ScoreKer</a><a href="../practice/">Practice table</a></div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="sheet">
    <div class="brand" id="resBrand">FRAME OVER</div>
    <div class="big" id="resTitle"></div>
    <p id="resText"></p>
    <div class="statgrid" id="resStats"></div>
    <div class="row2"><button class="go" id="nextBtn" type="button">Next frame</button><button class="ghostbtn" id="toMenuBtn" type="button">Menu</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
